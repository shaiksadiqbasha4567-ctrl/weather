<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
 
  <div class="card">
    <div class="search">
       <input type="text" id="search-in" placeholder="Enter city name" spellcheck="false">
       <button id="searchbtn"><i class="fa-solid fa-magnifying-glass fa-2x"></i></button>
      <button id="mic"><i class="fa-solid fa-microphone  fa-2x"></i></button>
      </div>
      <div id="loader" class="loader hidden">
        <p>Fetching Weather....</p>
        <div class="spinner">
        </div>
      </div>

      <div class="weather">
       <img src="atmosphere.svg" class="weather-icon">

        <h1 class="temp"> </h1>
        <h2 class="city"></h2>
          <div class="details">
             <div class="col">
                 <i class="fa-solid fa-droplet fa-3x humidity-icon" style="color: #fff;"></i>
                 <div>
                   <p  class="humidity"></p>
                   <p class="label">Humidity</p>
                  </div>
                  </div> 
                    <div class="col">
                     <i class="fa-solid fa-wind fa-3x wind-icon"></i>
                     <div>
                      <p  class="wind"></p>
                   <p class="label">wind Speed</p>
                    </div>
                 </div>
             </div>
         </div>
      </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
